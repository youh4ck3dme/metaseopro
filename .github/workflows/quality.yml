name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:deps
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run audit:lighthouse
      - name: Build Vercel output
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to Vercel
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} --project=${{ secrets.VERCEL_PROJECT_ID }}
